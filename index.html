<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Andrea</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- FONDO DE CORAZONES ANIMADOS --- */
        .hearts-background {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }

        .hearts-background li {
            position: absolute;
            list-style: none;
            display: block;
            width: 25px;
            height: 25px;
            background: rgba(255, 255, 255, 0.3);
            bottom: -50px;
            animation: float-hearts 20s linear infinite;
            transform: rotate(45deg);
        }

        /* Forma de corazón usando pseudo-elementos */
        .hearts-background li::before,
        .hearts-background li::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .hearts-background li::before {
            top: -12.5px;
            left: 0;
        }

        .hearts-background li::after {
            top: 0;
            left: -12.5px;
        }

        /* Posiciones y tiempos variados para los corazones */
        .hearts-background li:nth-child(1) { left: 10%; width: 20px; height: 20px; animation-duration: 15s; animation-delay: 0s; }
        .hearts-background li:nth-child(2) { left: 20%; width: 35px; height: 35px; animation-duration: 12s; animation-delay: 2s; }
        .hearts-background li:nth-child(3) { left: 35%; width: 15px; height: 15px; animation-duration: 25s; animation-delay: 4s; }
        .hearts-background li:nth-child(4) { left: 50%; width: 40px; height: 40px; animation-duration: 18s; animation-delay: 1s; }
        .hearts-background li:nth-child(5) { left: 65%; width: 25px; height: 25px; animation-duration: 14s; animation-delay: 3s; }
        .hearts-background li:nth-child(6) { left: 80%; width: 30px; height: 30px; animation-duration: 22s; animation-delay: 5s; }
        .hearts-background li:nth-child(7) { left: 90%; width: 20px; height: 20px; animation-duration: 16s; animation-delay: 2s; }

        @keyframes float-hearts {
            0% {
                transform: translateY(0) rotate(45deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* --- TARJETA CENTRAL --- */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.85);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 1;
            backdrop-filter: blur(5px);
            animation: pulse-card 3s ease-in-out infinite;
            max-width: 90%;
        }

        @keyframes pulse-card {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* --- TEXTO ANIMADO --- */
        h1 {
            color: #d63384;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(214, 51, 132, 0.2);
            animation: glow-text 2s ease-in-out infinite alternate;
        }

        @keyframes glow-text {
            from {
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.4), 0 0 20px rgba(255, 105, 180, 0.2);
            }
            to {
                text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 30px rgba(214, 51, 132, 0.6);
            }
        }

        p {
            color: #666;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* --- CORAZÓN LATINDECORATIVO --- */
        .big-heart {
            font-size: 4rem;
            color: #ff4757;
            margin-bottom: 10px;
            display: inline-block;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* Responsive para celulares */
        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Fondo de corazones flotantes -->
    <ul class="hearts-background">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- Tarjeta romántica -->
    <div class="card">
        <div class="big-heart">❤️</div>
        <h1>Andrea Te Amo</h1>
        <p>Para siempre juntos</p>
    </div>

</body>
</html>
